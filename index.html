<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Bitcount+Prop+Single+Ink:wght@100..900&family=Bungee&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lobster&family=Manrope:wght@200..800&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Playwrite+US+Modern:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style.css">

    <title>Legal Solutions |</title>
</head>

<body>

    <header class="pt-12.5">


        <!-- Navbar  -->
        <nav class="w-[75%] m-auto flex justify-between items-center">
            <div class="logo max-w-[158px]">
                <img src="./images/logo2.png" alt="">
            </div>

            <ul class="flex justify-between gap-7.5">
                <li class="transition-transform duration-300 hover:scale-110"><a href=""
                        class="text-[#707070] text-[16px] ">Home</a></li>
                <li class="transition-transform duration-300 hover:scale-110"><a href=""
                        class="text-[#707070] text-[16px]">Services <i class="fa-solid fa-chevron-right"></i></a>
                </li>
                <li class="transition-transform duration-300 hover:scale-110"><a href=""
                        class="text-[#707070] text-[16px]">Cases <i class="fa-solid fa-chevron-right"></i></a>
                </li>
                <li class="transition-transform duration-300 hover:scale-110"><a href=""
                        class="text-[#707070] text-[16px]">Blog <i class="fa-solid fa-chevron-right"></i></a>
                </li>
                <li class="transition-transform duration-300 hover:scale-110"><a href=""
                        class="text-[#707070] text-[16px]">Contact Us <i class="fa-solid fa-chevron-right"></i></a></li>
            </ul>

            <button
                class="text-5 text-white font-bold bg-[#B68C5A] px-7 py-4.5 border-none rounded-lg transition-transform duration-300 hover:scale-105">Free
                Consultation</button>

        </nav>

        <!-- Banner Section  -->


        <section
            class="banner bg-[url('./images/banner.png')] bg-cover bg-no-repeat max-w-[75%] m-auto mt-12.5 px-[240px] py-[104px] rounded-lg  bg-gradient-to-r from-black/90 to-white/20">

            <div class="content-here  m-auto max-w-[692px] text-center">
                <h1 class="text-white text-7xl font-extrabold mb-6">We Provide Effective <br> Legal Solutions</h1>
                <p class="text-[#E7E7E7] text-[16px] leading-[26px] mb-8">There are many variations of passages of Lorem
                    Ipsum available, but the majority have suffered alteration in some form, by injected humour.</p>

                <div class="flex justify-center m-auto gap-4">
                    <input class="w-[70%] py-4.5 bg-white border-none rounded-lg pl-10 text-[18px]" type="text" name=""
                        id="" placeholder="Search your services">
                    <button
                        class="w-[28%] py-4.5 bg-[#B68C5A] border-none rounded-lg text-white text-[18px] font-bold  transition-transform duration-300 hover:scale-105">Search</button>
                </div>

            </div>
        </section>


    </header>

</body>

</html>
